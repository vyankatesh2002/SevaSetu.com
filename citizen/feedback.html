<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .module-side {
            width: 240px;
            background: var(--color-gray-900);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .module-side .side-logo {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-side .side-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .module-side nav {
            flex: 1;
            padding: 12px 10px;
        }

        .module-side nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: all .2s;
        }

        .module-side nav a:hover,
        .module-side nav a.active {
            background: var(--color-primary);
            color: #fff;
        }

        .module-side .side-foot {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 12px;
            color: #9ca3af;
        }

        .civic-wrap {
            flex: 1;
            min-width: 0;
        }

        @media (max-width:768px) {
            body {
                flex-direction: column;
            }

            .module-side {
                width: 100%;
                height: auto;
                position: static;
            }

            .module-side nav {
                display: flex;
                overflow-x: auto;
            }

            .module-side nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">👤</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Citizen Module</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="register-complaint.html"><i class="bi bi-plus-circle"></i> Register Complaint</a>
            <a href="track.html"><i class="bi bi-search"></i> Track Complaint</a>
            <a href="history.html"><i class="bi bi-clock-history"></i> History</a>
            <a href="complaint-details.html"><i class="bi bi-file-text"></i> Complaint Details</a>
            <a href="emergency.html"><i class="bi bi-exclamation-triangle"></i> Emergency</a>
            <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
            <a href="feedback.html" class="active"><i class="bi bi-star"></i> Feedback</a>
        </nav>
        <div class="side-foot">Citizen Portal</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-card" style="max-width:700px;">
                <h3>⭐ Share Your Feedback</h3>
                <p class="section-desc">Help us improve the grievance experience.</p>
                <div class="mb-3">
                    <label class="sevasetu-label" for="fbSubject">Complaint ID (optional)</label>
                    <input class="sevasetu-input" id="fbSubject" type="text" placeholder="e.g. SVS-2026-000002">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="fbRating">Rating</label>
                    <select class="sevasetu-input" id="fbRating">
                        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4">⭐⭐⭐⭐ (4)</option>
                        <option value="3">⭐⭐⭐ (3)</option>
                        <option value="2">⭐⭐ (2)</option>
                        <option value="1">⭐ (1)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="fbMessage">Comments</label>
                    <textarea class="sevasetu-input" id="fbMessage" rows="4"
                        placeholder="Share your experience..."></textarea>
                </div>
                <button class="sevasetu-button btn-primary" id="fbBtn">📨 Submit Feedback</button>
                <div id="fbMsg" style="display:none;margin-top:12px;" class="sevasetu-badge b-green" aria-live="polite">
                </div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        document.getElementById('fbBtn').addEventListener('click', function () {
            var rating = document.getElementById('fbRating').value;
            var msg = document.getElementById('fbMessage').value.trim();
            if (!msg) { alert('Please enter a comment.'); return; }
            var m = document.getElementById('fbMsg');
            m.style.display = 'block';
            m.textContent = '✅ Thank you for your feedback! (Rating: ' + rating + '/5)';
            document.getElementById('fbMessage').value = '';
        });
    </script>
</body>

</html>
