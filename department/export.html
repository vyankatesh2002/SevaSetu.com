<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Reports | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .module-side {
            width: 240px;
            background: var(--color-gray-900);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .module-side .side-logo {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-side .side-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .module-side nav {
            flex: 1;
            padding: 12px 10px;
        }

        .module-side nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: all .2s;
        }

        .module-side nav a:hover,
        .module-side nav a.active {
            background: var(--color-primary);
            color: #fff;
        }

        .module-side .side-foot {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 12px;
            color: #9ca3af;
        }

        .civic-wrap {
            flex: 1;
            min-width: 0;
        }

        @media (max-width:768px) {
            body {
                flex-direction: column;
            }

            .module-side {
                width: 100%;
                height: auto;
                position: static;
            }

            .module-side nav {
                display: flex;
                overflow-x: auto;
            }

            .module-side nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">🏢</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Department Module</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="complaints.html"><i class="bi bi-list-ul"></i> Complaints</a>
            <a href="officers.html"><i class="bi bi-people"></i> Officers</a>
            <a href="analytics.html"><i class="bi bi-graph-up"></i> Analytics</a>
            <a href="heatmap.html"><i class="bi bi-map"></i> Heatmap</a>
            <a href="export.html" class="active"><i class="bi bi-download"></i> Export</a>
        </nav>
        <div class="side-foot">Dept. Head: Water Supply</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-card" style="max-width:600px;">
                <h3>📥 Export Reports</h3>
                <p class="sevasetu-muted">Download department data as CSV. (Demo — generates a sample file)</p>
                <div style="margin-top:16px;">
                    <label class="sevasetu-label" for="reportType">Report Type</label>
                    <select class="sevasetu-input" id="reportType">
                        <option value="complaints">All Complaints</option>
                        <option value="officers">Officer Summary</option>
                        <option value="analytics">Analytics Overview</option>
                    </select>
                    <br><br>
                    <button class="sevasetu-button btn-primary" id="exportBtn">📥 Download CSV</button>
                    <div id="exportMsg" style="display:none;margin-top:12px;" class="sevasetu-badge b-green"
                        aria-live="polite"></div>
                </div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        (function () {
            document.getElementById('exportBtn').addEventListener('click', function () {
                var type = document.getElementById('reportType').value;
                var dept = 'Water Supply';
                var rows = [];
                if (type === 'complaints') {
                    var complaints = (window.SVS) ? SVS.getComplaints().filter(function (c) { return c.department === dept; }) : [];
                    rows.push('ComplaintID,Title,Category,Priority,Status,Created,Officer');
                    complaints.forEach(function (c) { rows.push(c.complaintId + ',"' + c.title + '",' + c.category + ',' + c.priority + ',' + c.status + ',' + c.createdAt + ',' + c.assignedOfficer); });
                } else if (type === 'officers') {
                    var officers = (window.SVS) ? SVS.getOfficers().filter(function (o) { return o.department === dept; }) : [];
                    rows.push('Name,Designation,City,Status,Score');
                    officers.forEach(function (o) { rows.push(o.name + ',' + o.designation + ',' + o.city + ',' + o.status + ',' + o.performanceScore); });
                } else {
                    var compls = (window.SVS) ? SVS.getComplaints().filter(function (c) { return c.department === dept; }) : [];
                    rows.push('Total,Pending,Resolved,Escalated');
                    rows.push(compls.length + ',' + compls.filter(function (c) { return c.status === 'SUBMITTED' || c.status === 'AI_ANALYSED' || c.status === 'IN_PROGRESS'; }).length + ',' + compls.filter(function (c) { return c.status === 'RESOLVED' || c.status === 'CLOSED'; }).length + ',' + compls.filter(function (c) { return c.status === 'ESCALATED'; }).length);
                }
                var csv = rows.join('\n');
                var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                var link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'SevaSetu_' + type + '_' + dept.replace(' ', '') + '.csv';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                var m = document.getElementById('exportMsg'); m.style.display = 'block'; m.textContent = '✅ CSV downloaded.';
            });
        })();
    </script>
</body>

</html>
