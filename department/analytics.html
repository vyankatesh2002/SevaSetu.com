<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Analytics | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body { display:flex; min-height:100vh; margin:0; }
        .module-side { width:240px; background:var(--color-gray-900); color:#fff; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
        .module-side .side-logo { padding:18px 16px; border-bottom:1px solid rgba(255,255,255,.12); display:flex; align-items:center; gap:10px; }
        .module-side .side-logo .logo-icon { width:36px; height:36px; background:var(--color-primary); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; }
        .module-side nav { flex:1; padding:12px 10px; }
        .module-side nav a { display:flex; align-items:center; gap:10px; color:#cbd5e1; text-decoration:none; padding:10px 12px; border-radius:8px; font-size:14px; font-weight:500; margin-bottom:2px; transition:all .2s; }
        .module-side nav a:hover, .module-side nav a.active { background:var(--color-primary); color:#fff; }
        .module-side .side-foot { padding:14px 16px; border-top:1px solid rgba(255,255,255,.12); font-size:12px; color:#9ca3af; }
        .civic-wrap { flex:1; min-width:0; }
        .chart-simple { background:var(--color-gray-100); border-radius:var(--radius-md); padding:16px; margin-top:12px; }
        .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
        .bar-row .barlabel { width:120px; font-size:13px; font-weight:600; }
        .bar-row .bar { height:22px; background:var(--color-primary); border-radius:4px; color:#fff; display:flex; align-items:center; padding-left:8px; font-size:11px; }
        @media (max-width:768px) { body{flex-direction:column;} .module-side{width:100%;height:auto;position:static;} .module-side nav{display:flex;overflow-x:auto;} .module-side nav a{white-space:nowrap;} }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">🏢</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Department Module</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="complaints.html"><i class="bi bi-list-ul"></i> Complaints</a>
            <a href="officers.html"><i class="bi bi-people"></i> Officers</a>
            <a href="analytics.html" class="active"><i class="bi bi-graph-up"></i> Analytics</a>
            <a href="heatmap.html"><i class="bi bi-map"></i> Heatmap</a>
            <a href="export.html"><i class="bi bi-download"></i> Export</a>
        </nav>
        <div class="side-foot">Dept. Head: Water Supply</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-stats" id="statsRow">
                <div class="sevasetu-stat"><div class="num">0</div><div class="label">Total</div></div>
                <div class="sevasetu-stat"><div class="num">0</div><div class="label">Pending</div></div>
                <div class="sevasetu-stat"><div class="num">0</div><div class="label">Resolved</div></div>
                <div class="sevasetu-stat"><div class="num">0</div><div class="label">Escalated</div></div>
            </div>
            <div class="sevasetu-card">
                <h3>📊 Complaints by Status</h3>
                <div class="chart-simple" id="statusChart"></div>
            </div>
            <div class="sevasetu-card">
                <h3>📈 Priority Distribution</h3>
                <div class="chart-simple" id="priorityChart"></div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        (function () {
            var dept = 'Water Supply';
            var complaints = (window.SVS) ? SVS.getComplaints().filter(function (c) { return c.department === dept; }) : [];
            var total = complaints.length;
            var pending = complaints.filter(function (c) { return c.status === 'SUBMITTED' || c.status === 'AI_ANALYSED' || c.status === 'DEPARTMENT_ASSIGNED' || c.status === 'OFFICER_ASSIGNED' || c.status === 'ACCEPTED' || c.status === 'IN_PROGRESS'; }).length;
            var resolved = complaints.filter(function (c) { return c.status === 'RESOLVED' || c.status === 'CITIZEN_VERIFICATION' || c.status === 'CLOSED'; }).length;
            var escalated = complaints.filter(function (c) { return c.status === 'ESCALATED'; }).length;
            document.getElementById('statsRow').innerHTML = '<div class="sevasetu-stat"><div class="num">' + total + '</div><div class="label">Total</div></div><div class="sevasetu-stat"><div class="num">' + pending + '</div><div class="label">Pending</div></div><div class="sevasetu-stat"><div class="num">' + resolved + '</div><div class="label">Resolved</div></div><div class="sevasetu-stat"><div class="num">' + escalated + '</div><div class="label">Escalated</div></div>';

            // Status distribution bars
            var byStatus = {};
            complaints.forEach(function (c) { byStatus[c.status] = (byStatus[c.status] || 0) + 1; });
            var statusChart = document.getElementById('statusChart');
            statusChart.innerHTML = Object.keys(byStatus).map(function (s) {
                var count = byStatus[s];
                var pct = total ? Math.round((count / total) * 100) : 0;
                return '<div class="bar-row"><div class="barlabel">' + ((SVS.STATUS_LABELS && SVS.STATUS_LABELS[s]) || s) + '</div><div class="bar" style="width:' + Math.max(pct, 4) + '%">' + count + '</div></div>';
            }).join('') || '<p class="sevasetu-empty">No data.</p>';

            // Priority distribution
            var byPrio = {};
            complaints.forEach(function (c) { byPrio[c.priority] = (byPrio[c.priority] || 0) + 1; });
            var prioChart = document.getElementById('priorityChart');
            prioChart.innerHTML = Object.keys(byPrio).map(function (p) {
                var count = byPrio[p];
                var pct = total ? Math.round((count / total) * 100) : 0;
                var color = p === 'High' || p === 'Critical' ? 'var(--color-red)' : p === 'Medium' ? 'var(--color-saffron)' : 'var(--color-green)';
                return '<div class="bar-row"><div class="barlabel">' + p + '</div><div class="bar" style="width:' + Math.max(pct, 4) + '%;background:' + color + '">' + count + '</div></div>';
            }).join('') || '<p class="sevasetu-empty">No data.</p>';
        })();
    </script>
</body>

</html>
