<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SevaSetu</title>
    <meta name="description" content="Create a SevaSetu account.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        .auth-wrap {
            max-width: 460px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            background: var(--color-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.6rem;
            color: #fff;
            margin: 0 auto 14px;
        }
    </style>
</head>

<body>
    <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
    <a href="#main-content" class="skip-link">Skip to Main Content</a>
    <div id="sevasetu-root"></div>

    <main id="main-content" class="auth-wrap">
        <div class="sevasetu-card" style="text-align:center;">
            <div class="auth-logo">SS</div>
            <h2 style="margin-bottom:4px;">Join SevaSetu</h2>
            <p class="section-desc" style="margin:0 auto 24px;">Create your account · Research Prototype</p>

            <div style="text-align:left;">
                <div class="mb-3">
                    <label class="sevasetu-label" for="regName">👤 Full Name</label>
                    <input class="sevasetu-input" id="regName" type="text" placeholder="Your full name">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="regEmail">📧 Email</label>
                    <input class="sevasetu-input" id="regEmail" type="email" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="regPhone">📱 Phone</label>
                    <input class="sevasetu-input" id="regPhone" type="tel" placeholder="+91 9876543210">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="regPassword">🔑 Password</label>
                    <input class="sevasetu-input" id="regPassword" type="password" placeholder="Min 6 characters">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="regRole">👥 Role</label>
                    <select class="sevasetu-input" id="regRole">
                        <option value="citizen">Citizen</option>
                        <option value="officer">Officer</option>
                        <option value="department">Dept. Head</option>
                    </select>
                </div>
                <button class="sevasetu-button btn-primary" id="regBtn" style="width:100%;justify-content:center;">👤
                    Create Account</button>
            </div>

            <div style="text-align:center;margin-top:16px;font-size:13px;">
                Already have an account? <a href="login.html">Login</a>
            </div>
            <p class="section-desc" style="font-size:12px;margin-top:14px;">⚡ Academic demo — data stored locally only.
            </p>
        </div>
    </main>

    <div id="sevasetu-footer"></div>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('regBtn').addEventListener('click', function () {
                var name = document.getElementById('regName').value.trim();
                var email = document.getElementById('regEmail').value.trim();
                var phone = document.getElementById('regPhone').value.trim();
                var pass = document.getElementById('regPassword').value.trim();
                var role = document.getElementById('regRole').value;
                if (!name || !email || !pass) { alert('Please fill in required fields.'); return; }
                localStorage.setItem('svs_session', JSON.stringify({ role: role, loggedIn: true, name: name }));
                window.location.href = '../CIP.html';
            });
        });
    </script>
</body>

</html>
