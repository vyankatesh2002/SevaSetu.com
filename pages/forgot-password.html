<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #dbeafe);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrap {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .auth-card .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 12px;
            animation: logoPulse 3s infinite;
        }

        .auth-card h4 {
            font-weight: 800;
            text-align: center;
        }

        .auth-card .sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .links-row {
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
        }

        .links-row a {
            margin: 0 8px;
        }
    </style>
</head>

<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="logo-icon">🔐</div>
            <h4>Forgot Password</h4>
            <p class="sub">Enter your email to receive a reset link · Research Prototype</p>

            <form id="forgotForm" onsubmit="event.preventDefault(); submitReset();">
                <div class="mb-3">
                    <label class="form-label">📧 Email</label>
                    <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com">
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg"><i class="bi bi-envelope"></i> Send Reset
                    Link</button>
            </form>

            <p id="resetMsg" style="display:none;" class="text-center mt-3 text-success"></p>

            <div class="links-row">
                <a href="login.html" class="btn btn-outline btn-sm"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
            <div class="text-center mt-2">
                <a href="../index.html" class="btn btn-outline btn-sm"><i class="bi bi-house"></i> Home</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        function submitReset() {
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) { showToast('⚠️ Please enter your email'); return; }
            const msg = document.getElementById('resetMsg');
            msg.style.display = 'block';
            msg.innerHTML = '✅ Reset link sent to <strong>' + email + '</strong> (demo)';
            showToast('✅ Reset link sent');
        }
    </script>
</body>

</html>
