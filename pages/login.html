<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SevaSetu</title>
    <meta name="description" content="Login to SevaSetu.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        .auth-wrap { max-width:460px; margin:0 auto; padding:40px 20px; }
        .auth-logo { width:60px; height:60px; background:var(--color-primary); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.6rem; color:#fff; margin:0 auto 14px; }
    </style>
</head>

<body>
    <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
    <a href="#main-content" class="skip-link">Skip to Main Content</a>
    <div id="sevasetu-root"></div>

    <main id="main-content" class="auth-wrap">
        <div class="sevasetu-card" style="text-align:center;">
            <div class="auth-logo">SS</div>
            <h2 style="margin-bottom:4px;">SevaSetu</h2>
            <p class="section-desc" style="margin:0 auto 24px;">Login to your account · Research Prototype</p>

            <div style="text-align:left;">
                <div class="mb-3">
                    <label class="sevasetu-label" for="loginEmail">📧 Email</label>
                    <input class="sevasetu-input" id="loginEmail" type="email" value="demo@sevasetu.in">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="loginPassword">🔑 Password</label>
                    <input class="sevasetu-input" id="loginPassword" type="password" value="demo123">
                </div>
                <div class="mb-3">
                    <label class="sevasetu-label" for="loginRole">👥 Role</label>
                    <select class="sevasetu-input" id="loginRole">
                        <option value="citizen">Citizen</option>
                        <option value="officer">Officer</option>
                        <option value="department">Dept. Head</option>
                        <option value="admin">Admin</option>
                        <option value="superadmin">Super Admin</option>
                    </select>
                </div>
                <button class="sevasetu-button btn-primary" id="loginBtn" style="width:100%;justify-content:center;">🔑 Login</button>
            </div>

            <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:13px;">
                <a href="register.html">Create account</a>
                <a href="forgot-password.html">Forgot password?</a>
            </div>
            <p class="section-desc" style="font-size:12px;margin-top:14px;">⚡ Academic demo — any email/password works. Select a role to preview each module.</p>
        </div>
    </main>

    <div id="sevasetu-footer"></div>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('loginBtn').addEventListener('click', function () {
                var email = document.getElementById('loginEmail').value.trim();
                var pass = document.getElementById('loginPassword').value.trim();
                var role = document.getElementById('loginRole').value;
                if (!email || !pass) { alert('Please enter email and password.'); return; }
                // Demo session — replace with real auth in a production backend.
                localStorage.setItem('svs_session', JSON.stringify({ role: role, loggedIn: true, name: email.split('@')[0] }));
                var dest = {
                    citizen: '../citizen/dashboard.html',
                    officer: '../officer/dashboard.html',
                    department: '../department/dashboard.html',
                    admin: '../admin/dashboard.html',
                    superadmin: '../superadmin/dashboard.html'
                }[role];
                window.location.href = dest || '../citizen/dashboard.html';
            });
        });
    </script>
</body>

</html>
