<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Profile | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .module-side {
            width: 240px;
            background: var(--color-gray-900);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .module-side .side-logo {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-side .side-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .module-side nav {
            flex: 1;
            padding: 12px 10px;
        }

        .module-side nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: all .2s;
        }

        .module-side nav a:hover,
        .module-side nav a.active {
            background: var(--color-primary);
            color: #fff;
        }

        .module-side .side-foot {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 12px;
            color: #9ca3af;
        }

        .civic-wrap {
            flex: 1;
            min-width: 0;
        }

        @media (max-width:768px) {
            body {
                flex-direction: column;
            }

            .module-side {
                width: 100%;
                height: auto;
                position: static;
            }

            .module-side nav {
                display: flex;
                overflow-x: auto;
            }

            .module-side nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">👮</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Officer Module</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="assigned.html"><i class="bi bi-list-check"></i> Assigned</a>
            <a href="complaint-details.html"><i class="bi bi-file-text"></i> Complaint Details</a>
            <a href="update-status.html"><i class="bi bi-pencil-square"></i> Update Status</a>
            <a href="upload-proof.html"><i class="bi bi-camera"></i> Upload Proof</a>
            <a href="gps-verification.html"><i class="bi bi-geo-alt"></i> GPS Verification</a>
            <a href="escalation.html"><i class="bi bi-exclamation-triangle"></i> Escalation</a>
            <a href="profile.html" class="active"><i class="bi bi-person-circle"></i> Profile</a>
            <a href="performance.html"><i class="bi bi-bar-chart"></i> Performance</a>
        </nav>
        <div class="side-foot">Officer: Ramesh Kumar · Water Dept</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-card" style="max-width:700px;">
                <h3>👮 Officer Profile</h3>
                <div class="row" style="margin-top:16px;" id="profileData"></div>
                <div style="margin-top:16px;">
                    <a class="sevasetu-button btn-outline" href="dashboard.html">← Back to Dashboard</a>
                    <a class="sevasetu-button btn-ghost" href="../pages/login.html"
                        onclick="localStorage.removeItem('svs_session');return true;">Logout</a>
                </div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        (function () {
            var officer = (window.SVS) ? SVS.getOfficer('OF-001') : null;
            var html = '';
            html += '<div class="col-md-6"><p><strong>Name:</strong> ' + (officer ? officer.name : 'Ramesh Kumar') + '</p></div>';
            html += '<div class="col-md-6"><p><strong>Badge:</strong> #' + (officer ? officer.badge : '1234') + '</p></div>';
            html += '<div class="col-md-6"><p><strong>Department:</strong> ' + (officer ? officer.department : 'Water Supply') + '</p></div>';
            html += '<div class="col-md-6"><p><strong>Designation:</strong> ' + (officer ? officer.designation : 'Field Officer') + '</p></div>';
            html += '<div class="col-md-6"><p><strong>City:</strong> ' + (officer ? officer.city : 'Pune') + '</p></div>';
            html += '<div class="col-md-6"><p><strong>Mobile:</strong> ' + (officer ? officer.mobile : '9876543210') + '</p></div>';
            html += '<div class="col-md-6"><p><strong>Performance Score:</strong> ' + (officer ? officer.performanceScore : '92') + '/100</p></div>';
            html += '<div class="col-md-6"><p><strong>Status:</strong> ' + (officer ? officer.status : 'Active') + '</p></div>';
            document.getElementById('profileData').innerHTML = html;
        })();
    </script>
</body>

</html>
