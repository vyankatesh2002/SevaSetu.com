<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Complaints | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .module-side {
            width: 240px;
            background: var(--color-gray-900);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .module-side .side-logo {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-side .side-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .module-side nav {
            flex: 1;
            padding: 12px 10px;
        }

        .module-side nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: all .2s;
        }

        .module-side nav a:hover,
        .module-side nav a.active {
            background: var(--color-primary);
            color: #fff;
        }

        .module-side .side-foot {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 12px;
            color: #9ca3af;
        }

        .civic-wrap {
            flex: 1;
            min-width: 0;
        }

        @media (max-width:768px) {
            body {
                flex-direction: column;
            }

            .module-side {
                width: 100%;
                height: auto;
                position: static;
            }

            .module-side nav {
                display: flex;
                overflow-x: auto;
            }

            .module-side nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">👮</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Officer Module</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="assigned.html" class="active"><i class="bi bi-list-check"></i> Assigned</a>
            <a href="complaint-details.html"><i class="bi bi-file-text"></i> Complaint Details</a>
            <a href="update-status.html"><i class="bi bi-pencil-square"></i> Update Status</a>
            <a href="upload-proof.html"><i class="bi bi-camera"></i> Upload Proof</a>
            <a href="gps-verification.html"><i class="bi bi-geo-alt"></i> GPS Verification</a>
            <a href="escalation.html"><i class="bi bi-exclamation-triangle"></i> Escalation</a>
            <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
            <a href="performance.html"><i class="bi bi-bar-chart"></i> Performance</a>
        </nav>
        <div class="side-foot">Officer: Ramesh Kumar · Water Dept</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-card">
                <h3>📋 All Assigned Complaints</h3>
                <div class="sevasetu-table-wrap mt-3">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Subject</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="assignedTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        (function () {
            var officerId = 'OF-001';
            var complaints = (window.SVS) ? SVS.getComplaints().filter(function (c) { return c.assignedOfficer === officerId; }) : [];
            var tbody = document.getElementById('assignedTable');
            if (!complaints.length) { tbody.innerHTML = '<tr><td colspan="5" class="sevasetu-empty">No complaints assigned to you.</td></tr>'; }
            else {
                tbody.innerHTML = complaints.map(function (c) {
                    var label = (SVS.STATUS_LABELS && SVS.STATUS_LABELS[c.status]) || c.status;
                    var cls = (SVS.STATUS_BADGE_CLASS && SVS.STATUS_BADGE_CLASS[c.status]) || 'bg-secondary';
                    var prioCls = c.priority === 'High' || c.priority === 'Critical' ? 'b-red' : c.priority === 'Medium' ? 'b-amber' : 'b-green';
                    var action = c.status === 'OFFICER_ASSIGNED' || c.status === 'DEPARTMENT_ASSIGNED' ?
                        '<a class="sevasetu-button btn-sm btn-primary" href="update-status.html?id=' + c.complaintId + '">Accept</a>' :
                        (c.status === 'ACCEPTED' || c.status === 'IN_PROGRESS') ?
                            '<a class="sevasetu-button btn-sm btn-outline" href="update-status.html?id=' + c.complaintId + '">Update</a>' :
                            '<a class="sevasetu-button btn-sm btn-ghost" href="complaint-details.html?id=' + c.complaintId + '">View</a>';
                    return '<tr><td><strong>#' + c.complaintId + '</strong></td><td>' + c.title + '</td><td><span class="sevasetu-badge ' + prioCls + '">' + c.priority + '</span></td><td><span class="sevasetu-badge ' + cls + '">' + label + '</span></td><td>' + action + '</td></tr>';
                }).join('');
            }
        })();
    </script>
</body>

</html>
