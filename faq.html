<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | SevaSetu</title>
    <meta name="description" content="Frequently asked questions about SevaSetu.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/sevasetu.css">
    <style>
        .faq-item {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            overflow: hidden;
            background: var(--color-card);
            box-shadow: var(--shadow-sm);
        }

        .faq-q {
            padding: 16px 20px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--color-text);
        }

        .faq-q:hover {
            background: var(--color-gray-50);
        }

        .faq-a {
            padding: 0 20px 16px;
            color: var(--color-text-secondary);
            font-size: 14px;
            display: none;
        }

        .faq-item.open .faq-a {
            display: block;
        }

        .faq-item.open .faq-icon {
            transform: rotate(45deg);
        }

        .faq-icon {
            font-size: 20px;
            transition: transform .3s;
            color: var(--color-primary);
        }
    </style>
</head>

<body>
    <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
    <a href="#main-content" class="skip-link">Skip to Main Content</a>
    <div id="sevasetu-root"></div>

    <section class="sevasetu-hero">
        <div class="hero-label">Help Center</div>
        <h1>Frequently Asked Questions</h1>
        <p class="hero-sub">Answers to common questions about SevaSetu.</p>
    </section>

    <main id="main-content" class="sevasetu-section">
        <div class="sevasetu-container" style="max-width:820px;">
            <div id="faqList"></div>
        </div>
    </main>

    <div id="sevasetu-footer"></div>
    <script src="assets/js/sevasetu.js"></script>
    <script>
        (function () {
            var faqs = [
                { q: 'What is SevaSetu?', a: 'SevaSetu is an AI-assisted digital grievance management research prototype designed to simplify civic issue reporting and improve transparency.' },
                { q: 'Who can use SevaSetu?', a: 'Citizens, officers, departments, administrators and researchers can use the platform for their respective roles.' },
                { q: 'How do I register a complaint?', a: 'Use the "Register Complaint" button to file a new grievance with the relevant details.' },
                { q: 'How do I track a complaint?', a: 'Use the "Track Complaint" feature with your complaint ID to see live status and timeline.' },
                { q: 'What does the AI do?', a: 'AI assists with classification, prioritisation, routing and summarisation. It does not make final government decisions.' },
                { q: 'Does AI make government decisions?', a: 'No. AI assists the workflow. Final administrative decisions remain with authorised personnel.' },
                { q: 'Can I submit voice complaints?', a: 'Voice input is among the planned assisted-input modes for reporting grievances.' },
                { q: 'Can I upload images?', a: 'Yes, image attachments can be added when registering a complaint.' },
                { q: 'Is SevaSetu an official government website?', a: 'No. It is a research prototype for smart governance, not an official government website.' },
                { q: 'How is user information handled?', a: 'This is a research prototype. A real deployment would need its own privacy and data-handling policy.' }
            ];
            var list = document.getElementById('faqList');
            list.innerHTML = faqs.map(function (f, i) {
                return '<div class="faq-item"><div class="faq-q" tabindex="0" role="button" aria-expanded="false" data-i="' + i + '">' + f.q + ' <span class="faq-icon">+</span></div><div class="faq-a">' + f.a + '</div></div>';
            }).join('');
            document.querySelectorAll('.faq-q').forEach(function (el) {
                function toggle() {
                    var item = el.parentElement;
                    var isOpen = item.classList.contains('open');
                    document.querySelectorAll('.faq-item').forEach(function (i) { i.classList.remove('open'); });
                    document.querySelectorAll('.faq-q').forEach(function (q) { q.setAttribute('aria-expanded', 'false'); });
                    if (!isOpen) { item.classList.add('open'); el.setAttribute('aria-expanded', 'true'); }
                }
                el.addEventListener('click', toggle);
                el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
            });
        })();
    </script>
</body>

</html>
