<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .module-side {
            width: 240px;
            background: var(--color-gray-900);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .module-side .side-logo {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-side .side-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .module-side nav {
            flex: 1;
            padding: 12px 10px;
        }

        .module-side nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: all .2s;
        }

        .module-side nav a:hover,
        .module-side nav a.active {
            background: var(--color-primary);
            color: #fff;
        }

        .module-side .side-foot {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 12px;
            color: #9ca3af;
        }

        .civic-wrap {
            flex: 1;
            min-width: 0;
        }

        @media (max-width:768px) {
            body {
                flex-direction: column;
            }

            .module-side {
                width: 100%;
                height: auto;
                position: static;
            }

            .module-side nav {
                display: flex;
                overflow-x: auto;
            }

            .module-side nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">🌐</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Super Admin</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="states.html"><i class="bi bi-map"></i> States</a>
            <a href="cities.html"><i class="bi bi-building"></i> Cities</a>
            <a href="departments.html"><i class="bi bi-diagram-3"></i> Departments</a>
            <a href="officers.html"><i class="bi bi-person-badge"></i> Officers</a>
            <a href="ai-settings.html"><i class="bi bi-robot"></i> AI Settings</a>
            <a href="database.html"><i class="bi bi-database"></i> Database</a>
            <a href="security.html"><i class="bi bi-shield-lock"></i> Security</a>
            <a href="settings.html"><i class="bi bi-gear"></i> Settings</a>
            <a href="system-health.html"><i class="bi bi-heart-pulse"></i> System Health</a>
            <a href="backups.html"><i class="bi bi-cloud-arrow-up"></i> Backups</a>
            <a href="logs.html" class="active"><i class="bi bi-journal-text"></i> Logs</a>
        </nav>
        <div class="side-foot">Super Admin</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-card">
                <h3>📜 Audit & System Logs</h3>
                <div class="sevasetu-table-wrap mt-3">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>User</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="logTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        (function () {
            var S = window.SVS;
            var logs = S ? S.listEntities('svs_audit') : [];
            var tbody = document.getElementById('logTable');
            if (!logs.length) { tbody.innerHTML = '<tr><td colspan="3" class="sevasetu-empty">No logs.</td></tr>'; }
            else {
                tbody.innerHTML = logs.slice().reverse().map(function (l) {
                    return '<tr><td>' + (l.time || l.timestamp || '') + '</td><td>' + l.user + '</td><td>' + l.action + '</td></tr>';
                }).join('');
            }
        })();
    </script>
</body>

</html>
