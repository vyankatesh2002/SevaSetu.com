<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Departments | SevaSetu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/sevasetu.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .module-side {
            width: 240px;
            background: var(--color-gray-900);
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .module-side .side-logo {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .module-side .side-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .module-side nav {
            flex: 1;
            padding: 12px 10px;
        }

        .module-side nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            transition: all .2s;
        }

        .module-side nav a:hover,
        .module-side nav a.active {
            background: var(--color-primary);
            color: #fff;
        }

        .module-side .side-foot {
            padding: 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, .12);
            font-size: 12px;
            color: #9ca3af;
        }

        .civic-wrap {
            flex: 1;
            min-width: 0;
        }

        @media (max-width:768px) {
            body {
                flex-direction: column;
            }

            .module-side {
                width: 100%;
                height: auto;
                position: static;
            }

            .module-side nav {
                display: flex;
                overflow-x: auto;
            }

            .module-side nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body class="module-layout">
    <aside class="module-side">
        <div class="side-logo">
            <div class="logo-icon">🛡️</div>
            <div><strong>SevaSetu</strong><br><small style="color:#9ca3af;">Admin Module</small></div>
        </div>
        <nav>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="departments.html" class="active"><i class="bi bi-building"></i> Departments</a>
            <a href="citizens.html"><i class="bi bi-people"></i> Citizens</a>
            <a href="officers.html"><i class="bi bi-person-badge"></i> Officers</a>
            <a href="ai-analytics.html"><i class="bi bi-robot"></i> AI Analytics</a>
            <a href="statistics.html"><i class="bi bi-bar-chart"></i> Statistics</a>
            <a href="audit-logs.html"><i class="bi bi-clipboard-data"></i> Audit Logs</a>
            <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
            <a href="reports.html"><i class="bi bi-file-earmark-text"></i> Reports</a>
            <a href="settings.html"><i class="bi bi-gear"></i> Settings</a>
        </nav>
        <div class="side-foot">System Admin</div>
    </aside>

    <div class="civic-wrap">
        <div id="sevasetu-root"></div>
        <main id="main-content" class="sevasetu-section">
            <div id="sr-announcer" aria-live="polite" style="position:absolute;left:-9999px;"></div>
            <div class="sevasetu-card">
                <h3>🏢 Departments</h3>
                <div class="sevasetu-table-wrap mt-3">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>City</th>
                                <th>State</th>
                                <th>Officers</th>
                                <th>SLA</th>
                            </tr>
                        </thead>
                        <tbody id="deptTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
        <div id="sevasetu-footer"></div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/sevasetu.js"></script>
    <script>
        (function () {
            var S = window.SVS;
            var depts = S ? S.listEntities('svs_departments') : [];
            var officers = S ? S.getOfficers() : [];
            var tbody = document.getElementById('deptTable');
            if (!depts.length) { tbody.innerHTML = '<tr><td colspan="5" class="sevasetu-empty">No departments.</td></tr>'; }
            else {
                tbody.innerHTML = depts.map(function (d) {
                    var count = officers.filter(function (o) { return o.department === d.name; }).length;
                    return '<tr><td><strong>' + d.name + '</strong></td><td>' + d.city + '</td><td>' + d.state + '</td><td>' + count + '</td><td>' + d.sla + 'h</td></tr>';
                }).join('');
            }
        })();
    </script>
</body>

</html>
